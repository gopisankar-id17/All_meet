<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
</head>
<body>
    <!-- Join/Create Room Screen -->
    <div id="joinScreen" class="screen">
        <div class="join-container">
            <h1>📹 Video Call App</h1>
            <p class="subtitle">Connect with anyone, anywhere</p>
            
            <div class="join-options">
                <div class="option-card">
                    <h2>Create New Room</h2>
                    <button id="createRoomBtn" class="primary-btn">Create Room</button>
                </div>
                
                <div class="divider">OR</div>
                
                <div class="option-card">
                    <h2>Join Existing Room</h2>
                    <input type="text" id="roomIdInput" placeholder="Enter Room ID" class="room-input">
                    <button id="joinRoomBtn" class="primary-btn">Join Room</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Call Screen -->
    <div id="callScreen" class="screen hidden">
        <div class="header">
            <h1>📹 Video Call</h1>
            <div class="room-info">
                <span class="room-label">Room ID:</span>
                <span class="room-code" id="displayRoomId"></span>
                <button id="copyBtn" class="copy-btn" title="Copy Room ID">📋</button>
            </div>
        </div>

        <div class="video-container">
            <div class="video-wrapper main-video">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-placeholder" id="remotePlaceholder">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <p>Waiting for others to join...</p>
                    <p class="share-hint">Share the Room ID above with someone to start the call</p>
                </div>
                <div class="video-wrapper self-video">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">You</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="micBtn" title="Toggle Microphone">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>

            <button class="control-btn" id="cameraBtn" title="Toggle Camera">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
            </button>

            <button class="control-btn end-call" id="endBtn" title="End Call">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
        </div>

        <div class="status" id="status">Initializing...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
